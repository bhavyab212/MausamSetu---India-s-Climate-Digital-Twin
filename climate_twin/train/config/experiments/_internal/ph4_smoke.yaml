# ph4_smoke.yaml — Phase 4 real short training.
# Tiny window (2018-2022 train, 2023 val), 3 epochs, hidden=16.
# Purpose: prove the trainer + registry + tiered validation + heatmap
# pipeline works end-to-end on real data. Emits a checkpoint + tier4.json
# + tier3_heatmap.png under train/registry/models/india/ph4_smoke/.

extends: base.yaml

name: ph4_smoke
notes: >-
  Phase 4 end-to-end demo. Not a real model — just proves the full
  stack (dataset → trainer → tiered validation → heatmap → registry)
  works and produces expected artefacts.

seed: 42
deterministic: true

data:
  region: india
  train_years: [2018, 2022]
  val_years:   [2023, 2023]
  test_years:  [2024, 2025]
  variables:   [rain, tmax, tmin]
  include_satellite: false

model:
  hidden: 16
  seq_length: 7
  dropout: 0.1

optim:
  epochs: 3
  batch_size: 4
  lr: 1.0e-3
  warmup_epochs: 0
  scheduler: cosine
  mixed_precision: fp32
  gradient_accum: 1
  sampler_mode: inverse_frequency

loss:
  physics_spatial_smooth: 0.01
  physics_temporal_smooth: 0.0
  physics_tmax_ge_tmin: 0.02
  physics_bounds_penalty: 0.005

validation:
  tier1_every_n_batches: 100
  tier2_every_n_epochs: 1
  tier3_every_n_epochs: 1     # smoke: fire T3 every epoch
  bootstrap_samples: 100      # smoke: cheap bootstrap
  min_cells_for_metric: 5

early_stopping:
  patience: 5
  min_delta: 1.0e-3
