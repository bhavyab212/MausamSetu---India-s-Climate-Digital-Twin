# ph1_proof.yaml — smallest possible config for the Phase-1 STOP-gate proof.
# Not a real experiment. 2 tiny epochs on a single year to fit inside the
# proof test's join timeout while still exercising every event kind.

extends: base.yaml

name: ph1_proof
notes: >-
  Phase 1 runtime-spine proof. Exercises every event kind on the shortest
  possible training window. Do NOT compare its metrics with anything.

seed: 42
deterministic: true

data:
  region: india
  train_years: [2020, 2020]   # 366 days only
  val_years:   [2023, 2023]
  test_years:  [2024, 2025]
  variables:   [rain, tmax, tmin]

model:
  hidden: 12
  seq_length: 5
  dropout: 0.1

optim:
  epochs: 2
  batch_size: 4
  lr: 1.0e-3
  warmup_epochs: 0
  scheduler: none
  mixed_precision: fp32
  gradient_accum: 1
  sampler_mode: inverse_frequency

loss:
  physics_spatial_smooth: 0.0
  physics_temporal_smooth: 0.0
  physics_tmax_ge_tmin: 0.02
  physics_bounds_penalty: 0.0

validation:
  tier1_every_n_batches: 5
  tier2_every_n_epochs: 1
  tier3_every_n_epochs: 1
  bootstrap_samples: 50
  min_cells_for_metric: 5

early_stopping:
  patience: 999
  min_delta: 1.0e-4
