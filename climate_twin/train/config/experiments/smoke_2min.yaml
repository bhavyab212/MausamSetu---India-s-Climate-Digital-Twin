# smoke_2min.yaml — pipeline validation only.
# Purpose: "does the pipeline run at all?"  NOT a training run.
# The UI shows an amber warning when this is selected.

extends: base.yaml

name: smoke_2min
notes: >-
  2-minute pipeline test. Trains 1 year, 2 epochs on a tiny model.
  Do NOT use to compare skill or claim any conclusion. The Setup tab
  labels this as a pipeline check, not training.

seed: 42
deterministic: true

data:
  region: india
  train_years: [2020, 2020]
  val_years:   [2023, 2023]
  test_years:  [2024, 2025]
  variables:   [rain, tmax, tmin]

model:
  hidden: 16
  seq_length: 7
  dropout: 0.1

optim:
  epochs: 2
  batch_size: 8
  batch_size_auto: false        # smoke: fixed small batch
  lr: 1.0e-3
  warmup_epochs: 0
  scheduler: none
  mixed_precision: fp32
  mixed_precision_auto: false
  gradient_accum: 1
  sampler_mode: inverse_frequency
  num_workers: 0
  intent: smoke

loss:
  physics_spatial_smooth: 0.0
  physics_temporal_smooth: 0.0
  physics_tmax_ge_tmin: 0.02
  physics_bounds_penalty: 0.0

validation:
  tier1_every_n_batches: 20
  tier2_every_n_epochs: 1
  tier3_every_n_epochs: 1
  bootstrap_samples: 100
  min_cells_for_metric: 5

early_stopping:
  patience: 999
  min_delta: 1.0e-4
