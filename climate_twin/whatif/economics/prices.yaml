  moisture_discount_pct: 0.04
  transport_marketing_pct: 0.03
  citation:
    msp:   "CACP MSP notifications, wheat rabi MSP order"
    cost:  "DES Cost of Cultivation of Principal Crops 2019-20 base + CPI-AL adj."
    misc:  "FMC-Mkt mandi convention"

