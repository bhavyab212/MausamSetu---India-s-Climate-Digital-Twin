region_id: vidarbha
method: analog
season: "2024-25"

lt:
  ssps: ["ssp126", "ssp585"]
  horizon: 2050
  downscale_method: "qdm"
  models: null
  adaptations:
    - supplemental_irrigation_20mm_weekly
    - heat_tolerant_wheat_variant
    - raised_bunds_flood_protection

expected_headline:
  description: >
    LT payoff heatmap has 3 adaptation rows × 2 SSP columns; NPV_08
    values differ across SSPs (higher NPV under SSP5-8.5 because
