  stages_days:      {ini: 20, dev: 30, mid: 60, late: 30}     # total 140 d
  kc:               {ini: 0.30, mid: 1.15, end: 0.30}
  ky_overall:       1.05
  ky_stage:         {ini: 0.20, dev: 0.60, mid: 1.15, late: 0.40}
