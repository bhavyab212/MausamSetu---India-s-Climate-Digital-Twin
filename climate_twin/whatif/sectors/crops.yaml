# climate_twin/whatif/sectors/crops.yaml
#
# Crop parameter registry for the What-If agriculture sector (Part 3).
# All numbers in this file MUST carry a citation. When you change a
# value, bump the top-level `version` string; that version flows into
# every scenario's provenance record via crops.py.
#
# Sources (short-hand; expanded in each entry's `citation` block):
#   FAO-56  Allen, Pereira, Raes, Smith (1998). Crop Evapotranspiration.
#           FAO Irrigation & Drainage Paper 56.  Tables 11 (stage lengths),
#           12 (Kc values), 22 (root depths + depletion fractions).
#   FAO-33  Doorenbos & Kassam (1979). Yield Response to Water.
#           FAO Irrigation & Drainage Paper 33.  Ky per crop / stage.
#   ICAR    Indian Council of Agricultural Research; DES (Directorate of
#           Economics & Statistics, DoAg&Fw).  Regional Ymax anchors.
#   Wheeler Wheeler et al. 2000, Agriculture, Ecosystems & Environment
#           (heat stress at flowering / grain-fill in wheat & rice).
#
# Version is the ONLY id that appears in provenance -- bump it whenever
# any downstream number here changes.

version: "crops-v1"

# ─── Paddy (Kharif, transplanted, tropical India) ──────────────────────
paddy_kharif:
  common_name: "Paddy (Kharif)"
  citation:
    kc:     "FAO-56 Table 12; rice, paddy"
    ky:     "FAO-33 (Doorenbos & Kassam 1979) Table; paddy overall & per-stage"
    stages: "FAO-56 Table 11; rice, tropical, wet-season sowing"
    root:   "FAO-56 Table 22; rice root depth 0.5-1.0 m"
    depletion: "FAO-56 Table 22; rice p = 0.20 (wetland)"
    ymax:   "ICAR-CRRI Cuttack; regional attainable yield anchor ~4.5 t/ha"
    heat:   "Wheeler et al. 2000; sterility above ~35 C at anthesis"
  stages_days:      {ini: 30, dev: 30, mid: 60, late: 30}     # total 150 d
  kc:               {ini: 1.05, mid: 1.20, end: 0.70}
  ky_overall:       1.10
  ky_stage:         {ini: 1.00, dev: 1.09, mid: 1.32, late: 0.50}
  root_depth_m:     {ini: 0.10, max: 0.60}
  depletion_p:      0.20
  t_base_c:         10.0
  t_cap_c:          30.0
  t_flower_stress_c: 35.0
  flower_stage:     "mid"
  ymax_t_per_ha:    4.5
  msp_inr_per_qt:   2300

